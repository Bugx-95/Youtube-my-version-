<!--The challanges to recreate btns from famouse websites-->

<!--Linkedin : "Apply on website & Save" btn with hover-->

<style>
  .apply-from-web{
    color: white;
    background-color: rgb(10, 102, 194);
    border: none;
    height: 26px;
    width: 200px;
    border-radius: 13px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .apply-from-web:hover{
    background-color: rgb(14, 80, 146);
  }
  .save-btn{
    color: rgb(10, 102, 194);
    background-color: white;
    border-color: rgb(10, 102, 194);
    border-style: solid;
    border-width: 1px;
    height: 26px;
    width: 70px;
    border-radius: 13px;
    cursor: pointer;
    transition: border-width 0.15s background-color 0.15s;
  }
  .save-btn:hover{
    border-width: 1.5px;
    background-color: rgba(10, 102, 194, 0.1);
  }
</style>

<button class="apply-from-web">Apply on company website</button>
<button class="save-btn">Save</button>
